  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function () {
        if (!('serviceWorker' in navigator)) return;

        // Detect preview / iframe contexts — never register the SW there.
        var inIframe = false;
        try { inIframe = window.self !== window.top; } catch (e) { inIframe = true; }
        var host = window.location.hostname;
        var isPreview =
          inIframe ||
          host.indexOf('id-preview--') !== -1 ||
          host.indexOf('lovableproject.com') !== -1 ||
          host.indexOf('lovable.app') !== -1 ||
          host === 'localhost' ||
          host === '127.0.0.1';

        if (isPreview) {
          // Aggressively clean up any previously-registered SW + caches in preview.
          navigator.serviceWorker.getRegistrations()
            .then(function (regs) { regs.forEach(function (r) { r.unregister(); }); })
            .catch(function () {});
          if (window.caches && caches.keys) {
            caches.keys().then(function (keys) { keys.forEach(function (k) { caches.delete(k); }); }).catch(function () {});
          }
          return;
        }

        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js')
            .then(function (reg) {
              // When a new SW is found, activate it ASAP and reload once it takes over.
              reg.addEventListener('updatefound', function () {
                var nw = reg.installing;
                if (!nw) return;
                nw.addEventListener('statechange', function () {
                  if (nw.state === 'installed' && navigator.serviceWorker.controller) {
                    nw.postMessage({ type: 'SKIP_WAITING' });
                  }
                });
              });

              // Check for updates on each load.
              reg.update().catch(function () {});
            })
            .catch(function (err) {
              console.error('Service worker registration failed:', err);
            });

          // Reload exactly once when a new SW takes control.
          var refreshing = false;
          navigator.serviceWorker.addEventListener('controllerchange', function () {
            if (refreshing) return;
            refreshing = true;
            window.location.reload();
          });
        });
      })();
    </script>
  </body>
